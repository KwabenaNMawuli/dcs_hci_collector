<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check My Recordings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/viewer.css">
</head>
<body>
<header class="top">
  <button class="icon-btn menu-btn" id="menuBtn" title="List of items" aria-label="Open the list of items">☰</button>
  <div class="brand"><span class="dot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></span>Check My Recordings</div>
  <span class="file-chip" id="whoChip"></span>
  <span class="spacer"></span>
  <a class="icon-btn" href="/" title="Back to the recorder">🎙️ <span class="hide-sm">Recorder</span></a>
  <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark theme">◐</button>
</header>

<section class="landing" id="landing">
  <div class="drop">
    <div class="big-icon" id="msgIcon">⏳</div>
    <h1 id="msgTitle">Loading your recordings…</h1>
    <p id="msgBody">Checking Google Drive for everything you have recorded.</p>
    <div class="actions hidden" id="msgActions">
      <button class="primary" id="retryBtn">Try again</button>
      <a class="secondary" href="/">Back to the recorder</a>
    </div>
  </div>
</section>

<div class="bar hidden" id="bar">
  <span class="lang-tabs hidden" id="langTabs"></span>
  <span class="stat ok">Recorded <b id="stRecorded">0</b> of <b id="stTotal">0</b></span>
  <span class="stat bad hidden" id="stMissingWrap">Missing <b id="stMissing">0</b></span>
  <span class="stat warn hidden" id="stPendingWrap">Uploading <b id="stPending">0</b></span>
  <span class="stat">Checked <b id="stChecked">0</b></span>
  <span class="spacer"></span>
  <button class="icon-btn hidden" id="showMissingBtn">Show missing</button>
  <span class="signed hidden" id="signedLbl"></span>
  <button class="icon-btn hidden" id="reopenBtn">Reopen</button>
  <button class="icon-btn solid" id="signoffBtn">Sign off my audit</button>
</div>

<section class="app hidden" id="app">
  <aside class="side">
    <div class="side-head">
      <input class="search" id="search" placeholder="Search question or text…  ( / )" aria-label="Search items">
      <div class="filters" id="filters"></div>
      <div class="count"><span id="countLbl"></span><span id="doneLbl"></span></div>
      <div class="progress-bar"><i id="doneBar"></i></div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <main class="main">
    <div class="card text-card">
      <div class="text-head">
        <div class="title" id="title"></div>
        <div class="chips" id="chips"></div>
        <span class="spacer"></span>
        <a class="icon-btn hidden" id="recordLink" href="/">🎙️ Go record this</a>
        <button class="icon-btn" id="fontDown" title="Smaller text" aria-label="Smaller text">A−</button>
        <button class="icon-btn" id="fontUp" title="Larger text" aria-label="Larger text">A+</button>
        <button class="icon-btn" id="copyBtn" title="Copy text">Copy</button>
        <button class="icon-btn" id="doneBtn" title="Mark as checked (M)">✓ Checked</button>
      </div>
      <div class="text" id="text"></div>
    </div>

    <div class="card player">
      <div class="wave-wrap" id="wave"><canvas id="canvas"></canvas><div class="wave-msg" id="waveMsg"></div></div>
      <div class="controls">
        <button class="icon-btn" id="prevBtn" title="Previous (←)" aria-label="Previous item">⏮</button>
        <button class="play" id="playBtn" title="Play / pause (Space)" aria-label="Play or pause"><svg id="playIco" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <button class="icon-btn" id="nextBtn" title="Next (→)" aria-label="Next item">⏭</button>
        <span class="time" id="time">0:00 / 0:00</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="backBtn" title="Back 5 seconds (J)">−5s</button>
        <button class="icon-btn" id="fwdBtn" title="Forward 5 seconds (L)">+5s</button>
        <select class="speed" id="speed" title="Playback speed" aria-label="Playback speed">
          <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
        </select>
        <button class="icon-btn" id="loopBtn" title="Loop this clip">Loop</button>
        <button class="icon-btn" id="autoBtn" title="Play the next item automatically">Auto-next</button>
      </div>
      <div class="kbd"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> previous/next · <kbd>J</kbd><kbd>L</kbd> ±5s · <kbd>M</kbd> mark checked · <kbd>/</kbd> search</div>
    </div>
  </main>
</section>

<audio id="audio" preload="auto"></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/viewer-core.js"></script>
<script src="/audit.js"></script>
</body>
</html>
